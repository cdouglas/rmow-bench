version: 1
# labbook's part of the site: each page dated from git, a body wide enough for charts (lab build
# writes it; labbook/site/)
extends: _build/labbook/myst.yml
project:
  title: rmow-bench results
  # The run catalog and the pages that browse runs, then the experiments in three kinds:
  # results, as a paper would show them (measured on the cloud stores, or simulated where the page
  # says so); decisions, the data behind a fork in the implementation; and calibration, which checks
  # the benchmark's own measures. Pages on the runs retired on 2026-11-12 are in git at bfbdf33
  # (docs/LESSONS.md)
  toc:
    - file: index.md
    - file: pages/run.md
    - title: Results
      children:
        - file: pages/workloads-128.md
        - file: pages/workloads.md
        - file: pages/workloads-cloud.md
        - file: pages/reader-changes.md
    - title: Decisions
      children:
        - file: pages/region-cut.md
        - file: pages/inserts-128.md
        - file: pages/suite-128.md
    - title: Calibration
      children:
        - file: pages/simulation-cloud.md
        - file: pages/model-128.md
        - file: pages/compare.md
        - file: pages/micro.md
  exclude:
    - NOTES.md
    - pages/_*.md
site:
  template: book-theme
