# What the raw results cannot say about themselves; applied by `lab ingest`, edited by hand or
# with `lab annotate`. Selectors: a run_id glob, "path:<glob>" (path under the project root),
# "source:<name>", or "where:<SQL over runs_raw>".

[campaigns.micro]
title = "Footer micro-benchmarks (JMH)"
select = ["source:micro"]

[campaigns.windows]
title = "Reads of a range across the table (docs/HYPOTHESES.md, 2026-11-07, Q1-Q4): the split and seal campaigns' configurations but upd-base-scan, labelled win-*, with five windows of 1% read at each probe under every reader (by id on the updates, by event time on the inserts). On havoc at 479edb1 for requests, bytes and held memory, and on the laptop (bearyak, the same build) for instructions; the two must agree on every request and byte"
select = ["where:label LIKE 'win-%' AND git_sha LIKE '479edb1%'"]

[campaigns.workloads-ref]
title = "The two workloads' main configurations, labelled wl-*, the references for their cloud run (docs/HYPOTHESES.md, 2026-11-10, L1-L4): the windows campaign's, with the locate pruned by each changed key and the sorted read skipping dead row groups, read through the skipping reader alone. On havoc at b49a57f for requests, bytes and held memory, and on the laptop (bearyak) at 0942497 for instructions; 0942497 adds only the fuzzer's layout.eagerBytes, which these leave unset"
select = ["where:label LIKE 'wl-%' AND host IN ('havoc', 'bearyak')"]

[campaigns.workloads-cloud]
title = "The two workloads in the cloud (docs/HYPOTHESES.md, 2026-11-10, L1-L4): the five wl-* configurations at 0942497 on S3 Express (a c7a.4xlarge each in usw2-az3, four at once and wl-ing-compact after, each after its twin on its own disk and its spike) and on Azure Blob (one D8as_v6 in westus, in turn, after one spike), 2026-11-11"
select = ["where:regexp_matches(label, '^wl-.*-(s3x|azure)$') AND git_sha LIKE '0942497%'", "where:label LIKE 'wl-%' AND host LIKE 'ip-%' AND git_sha LIKE '0942497%'", "spike/s3x-spike-wl-*", "spike/azure-spike-20261111T040817Z"]

[campaigns.density128]
title = "The designs as built at 128 MiB row groups, on a table 8 times win-upd-base's, on havoc at 2025e7c: D1 and D2 (docs/HYPOTHESES.md, 2026-11-09)"
select = ["where:label IN ('d128-upd-mor', 'd128-upd-compact', 'd128-upd-density', 'd128-upd-copies')"]

[campaigns.density128-cut]
title = "Copies cut where a write changes, at 128 MiB row groups, on havoc at a68eda3: D3 and D4 (docs/HYPOTHESES.md, 2026-11-09)"
select = ["where:label IN ('d128-upd-cut', 'd128-upd-density-cut')"]

[campaigns.w128]
title = "Every design on both workloads at Iceberg's 128 MiB row groups (docs/HYPOTHESES.md, 2026-11-12, W1-W5, and its revision for the inserts): docker/campaigns/w128.json on havoc, 3 cores a job, four at once. The updates at dd15dc9; the inserts, which failed at start there (the op log's hash held it in one array, past 2 GiB), at 14727a8, which streams it and changes nothing else"
select = ["where:label LIKE 'w128-%' AND host = 'havoc'"]

[campaigns.w128-twins]
title = "Campaign w128's nine configurations again on the laptop, for their work: instruction counters, which havoc's container lacks (lab/pages/workloads-128.md prices havoc's requests and adds this work). At 7590d4a (build snapshot 20261115T071921Z-7590d4a6d299), one at a time with a 12g heap (w128-upd-external, which ran out of it, with 18g); their requests and bytes equal havoc's runs' record for record (steps_diff). Five stand, the update configurations' (the results page times the updates from w128-keys-2); RMoW-append's and the inserts' four were retired on 2026-11-18 for campaign w128-twins-2's (docs/EXPERIMENTS.md, Retired runs)"
select = ["where:label LIKE 'w128-%' AND host <> 'havoc' AND json_extract(manifest, '$.verify') IS NULL"]

[campaigns.w128-twins-2]
title = "Four of campaign w128-twins' configurations again on the laptop, measured without the oracle in the reads (docs/HYPOTHESES.md, 2026-11-18; docs/HARNESS.md, Correctness: they only count their rows): w128-upd-append and the three inserts, one at a time with a 12g heap and no request log, from build snapshot 20261117T225741Z-6daa88784286 (main 6daa887, the fork at a32bc97, the w128-keys-2 runs' jar and libraries). Havoc's w128 run of each, which checked every row, vouches for it (steps_diff)"
select = ["where:label LIKE 'w128-%' AND host <> 'havoc' AND json_extract(manifest, '$.verify') IS NOT NULL"]

[campaigns.w128-keys]
title = "Campaign w128's five update configurations with writers that prune row groups by each changed key (locate keys), labelled w128k-upd-* (docs/HYPOTHESES.md, 2026-11-16, K1-K3): on the laptop alone, one at a time with requests logged, from build snapshot 20261117T005411Z-202bc66bc369 (commit 202bc66, its jar and libraries the w128 twins')"
select = ["where:label LIKE 'w128k-%' AND json_extract(manifest, '$.verify') IS NULL"]

[campaigns.w128-keys-2]
title = "Campaign w128-keys again, measured without the oracle in the reads (2026-11-17, docs/HARNESS.md, Correctness: they only count their rows), on the laptop alone, one at a time with requests logged, from a build snapshot of main; and a verification run of each (--verify, on havoc, excluded), which steps_diff ties to it. The results pages time the updates from these runs; suite-128.md judged K1-K3 on w128-keys"
select = ["where:label LIKE 'w128k-%' AND json_extract(manifest, '$.verify') IS NOT NULL AND started_at < TIMESTAMP '2026-11-19'"]

[campaigns.diag-mor]
title = "A diagnostic of MoR's full scans under locate keys (docs/HYPOTHESES.md, 2026-11-17): w128k-upd-mor and w128-upd-mor for 20 writes each, on the laptop one at a time from build snapshot 20261117T005411Z-202bc66bc369, with the JIT's compilation log and the GC log (in the snapshot's logs/diag); every record equals the first 20 writes of its 240-write run (steps_diff)"
select = ["where:label LIKE 'diag-mor-%' AND json_extract(manifest, '$.verify') IS NULL"]

[campaigns.oracle-out]
title = "What the oracle cost a read (docs/HYPOTHESES.md, 2026-11-17): the diag-mor configurations again, measured without the oracle in their reads (verify false), from build snapshot 20261117T203716Z-2722f89e4829-dirty (branch oracle-out) with the JIT's compilation log, and a verification run of each (--verify, excluded) from 20261117T205656Z-2722f89e4829-dirty"
select = ["where:label LIKE 'diag-mor-%' AND json_extract(manifest, '$.verify') IS NOT NULL"]

[campaigns.prices]
title = "The two latency tests (spikes) the simulated pages price requests with (analysis/tune.py SPIKES; region-cut): S3 Express from the base point's c7a.4xlarge in usw2-az3, and Azure Blob from a D8as_v6 in westus, both 2026-10-31 at 6f24575"
select = ["spike/s3x-spike-20261031T163533Z", "spike/azure-spike-20261031T234510Z"]

[campaigns.w128-merge]
title = "The merge compaction at 128 MiB (docs/HYPOTHESES.md P1-P4, 2026-11-20; density plan steps 2 and 3): RMoR-density with the merge and delta files at theta 0.06 and 0.15, and the control that never copies (theta 9, MoR (deltas by key range)), on the clustered workload; those and MoR, MoR (compacted) and RMoR-density on the sparse workload (updateShare 0). On the laptop, one at a time with a 12g heap and requests logged, from build snapshot 20261120T075226Z-725a8cf399f4-dirty (branch merge-compaction's 43f3123 and 508a718, the fork at 62cdc89288). The clustered baselines are w128-keys-2's. Write-up: pages/merge-128.md"
select = ["where:label LIKE 'w128%-upd-%' AND started_at >= TIMESTAMP '2026-11-20 07:00:00' AND started_at < TIMESTAMP '2026-11-21 05:00:00'"]

[campaigns.w128-merge-verify]
title = "A verification run (--verify, every row checked, excluded) of each of campaign w128-merge's nine runs, on the laptop from the same build snapshot, 2026-11-24/25 (havoc's first attempt died when its disk filled). Each run's records equal its measured run's (steps_diff)"
select = ["where:label LIKE 'w128%-upd-%' AND started_at >= TIMESTAMP '2026-11-24 17:00:00' AND started_at < TIMESTAMP '2026-11-25 18:00:00'"]
[[annotate]]
select = "where:coalesce(try_cast(json_extract(manifest, '$.verify') AS BOOLEAN), false)"
mark = "excluded"
tags = ["verify"]
note = "a verification run (--verify): its reads check every row against the reference model, so it measures nothing; it vouches for the measured runs of its config (steps_diff)"
