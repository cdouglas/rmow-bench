# labbook: where rmow-bench's results are and how to read them (see the labbook skill).
version = 1

[project]
name = "rmow-bench"
root = ".."

# bin/run.sh writes results/<label>-<config hash>/<UTC start>/ with manifest.json, steps.jsonl and,
# with --dump-versions, versions/<arm>/**/*.parquet plus versions/versions.csv. Retired runs are
# renamed superseded-*; the run id comes from the manifest, so it survives the rename.
[[runs]]
name = "bench"
kind = "manifest"
root = "results"
glob = "*/*"
exclude = ["builds/*", "micro/*", "spike/*", "campaigns/*"]
id = "{label}-{config_hash}/{started}"

[runs.fields]
started = { path = "started", format = "%Y%m%dT%H%M%SZ" }
git_sha = "versions.rmow_bench_git"
git_dirty = "versions.rmow_bench_dirty"

[runs.promote]
store = "config.store.type"
key_dist = "config.workload.keyDist"
batches = { path = "config.workload.batches", type = "INTEGER" }
region_rows = { path = "config.workload.regionRows", type = "BIGINT" }
region_skew = { path = "config.workload.regionSkew", type = "DOUBLE" }
update_share = { path = "config.workload.updateShare", type = "DOUBLE" }
rg_bytes = { path = "config.layout.rowGroupBytes", type = "BIGINT" }
tail_seal_bytes = { path = "config.layout.tailSealBytes", type = "BIGINT" }
compact_every = { path = "config.layout.compactEvery", type = "INTEGER" }
compact_delete_ratio = { path = "config.layout.compactDeleteRatio", type = "DOUBLE" }
compact_garbage_ratio = { path = "config.layout.compactGarbageRatio", type = "DOUBLE" }
compact_small_rgs = { path = "config.layout.compactSmallRowGroups", type = "INTEGER" }
rmor_rewrite_share = { path = "config.layout.rmorRewriteShare", type = "DOUBLE" }
reads_every = { path = "config.reads.every", type = "INTEGER" }
oplog = "oplog_sha256"
verify_rows = { path = "config.verifyRows", type = "BOOLEAN" }
cpu_model = "host.cpu_model"

# The store spikes (S3ExpressSpike, AzureSpike) write results/spike/<label>-<UTC start>/:
# manifest.json (label, started, root, endpoint, reps; finished once done) and spike.jsonl. On an
# emulator (endpoint set) a spike checks the code, not the store.
[[runs]]
name = "spike"
kind = "manifest"
root = "results/spike"
glob = "*"
id = "spike/{dir.name}"

[runs.fields]
started = { path = "started", format = "%Y%m%dT%H%M%SZ" }
host = "host"
params = "."

[runs.promote]
endpoint = "endpoint"
reps = { path = "reps", type = "INTEGER" }

# JMH micro-benchmarks (-rf json), one run per file
[[runs]]
name = "micro"
kind = "jmh"
root = "results/micro"
glob = "*.json"

# One row per arm, step and phase. Phases carry different fields (state rows: stored_bytes,
# live_bytes, ...; later runs add live_objects), so the files are read by name; an interrupted
# run's last line can be cut off. -1 means unknown in footer_bytes and row_groups_out_of_order.
[[facts]]
name = "steps"
runs = "bench"
file = "steps.jsonl"
format = "jsonl"
mode = "table"
options = { ignore_errors = true }
cast = { footer_bytes = "BIGINT", row_groups_out_of_order = "BIGINT" }

# The version dumps' Parquet footers: one row per column chunk (file_name, row_group_id,
# total_compressed_size, ...); arm from the path. Footers only, so the 5 GB of dumps stay unread.
[[facts]]
name = "rg_meta"
runs = "bench"
file = "versions/**/*.parquet"
format = "parquet_metadata"
path_pattern = '^versions/(?P<arm>[^/]+)/'
mode = "table"

# The request log (bin/run.sh --log-requests): one record per request, stream read or split task
# of each outermost phase, for the latency replay (figures.replay, lab/pages/store-latency.md).
[[facts]]
name = "requests"
runs = "bench"
file = "requests.jsonl"
format = "jsonl"
mode = "table"
only_finished = true
options = { ignore_errors = true }

# The spikes' requests, one record each: op, bytes (the size written or read), parts (the
# appendable object's parts after it, or the parts of the object a GET read), rep and ns (its wall
# time on the VM)
[[facts]]
name = "spike_requests"
runs = "spike"
file = "spike.jsonl"
format = "jsonl"
mode = "table"
only_finished = true
options = { ignore_errors = true }

# The append spike's requests (AzureAppendSpike, results/spike/azure-appends-*; not RMoW's, for the
# catalog's shared log), one record each: level, mode (blind or conditional), bytes, writers,
# writer, seq, op (append, or the head after a lost race), outcome (ok, lost, throttled, error,
# full), status, code, offset, blocks, start_ns (from the level's start), ns, steady (after the
# warm-up and before the deadline)
[[facts]]
name = "append_requests"
runs = "spike"
file = "appends.jsonl"
format = "jsonl"
mode = "table"
only_finished = true
options = { ignore_errors = true }

# The append spike's levels, one record each: rates over the steady window, latency percentiles by
# op and outcome, the client's CPU share, and the check of the blob's frames
[[facts]]
name = "append_levels"
runs = "spike"
file = "levels.jsonl"
format = "jsonl"
mode = "table"
only_finished = true
options = { ignore_errors = true }

# The container runner's foreign-load samples (docker/campaign.py), added to a run when it ends:
# one per second, each over the wall-clock interval [t0, t1] in epoch seconds, with the job's own
# CPUs, the foreign load on its cores and the busy time of its idle SMT siblings. Matched to
# phases by their start_ms in the view phase_load (views/50_containers.sql).
[[facts]]
name = "load"
runs = "bench"
file = "load.jsonl"
format = "jsonl"
mode = "table"
options = { ignore_errors = true }

[[facts]]
name = "version_dump"
runs = "bench"
file = "versions/versions.csv"
format = "csv"

# The container runner's records (docker/campaign.py), one file per job of each campaign plus the
# campaign's progress.json: placement, run directory and foreign load (the busy time of the job's
# cores, SMT siblings included, less its own CPU time). Per job and run in container_jobs.
[[tables]]
name = "container_records"
file = "results/campaigns/*/*.json"
format = "json"
options = { filename = true, union_by_name = true }

# analysis/plots.py's encoding: hue is the arm's family, shape the variant within it
[style]
family = { mor = "#2a78d6", cow = "#eb6834", rmow = "#1baf7a", rmowsplit = "#e87ba4", rmor = "#8a63d2" }
